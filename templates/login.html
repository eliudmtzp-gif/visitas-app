<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Administrador</title>
    <style>
        body { font-family: Arial; background: #f9f9f9; margin: 0; padding: 0; }
        .container { max-width: 400px; margin: 80px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #218838; }
        .mensaje { margin: 10px 0; padding: 10px; border-radius: 5px; font-weight: bold; }
        .mensaje.exito { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .mensaje.advertencia { background: #fff3cd; border: 1px solid #ffeeba; color: #856404; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login Administrador</h2>

        {% with mensajes = get_flashed_messages() %}
          {% if mensajes %}
            {% for m in mensajes %}
              {% if "✅" in m %}
                <div class="mensaje exito">{{ m }}</div>
              {% else %}
                <div class="mensaje advertencia">{{ m }}</div>
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="usuario" placeholder="Usuario" required>
            <input type="password" name="clave" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
        </form>
    </div>
</body>
</html>
